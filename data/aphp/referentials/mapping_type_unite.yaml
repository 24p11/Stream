# mapping_type_unite.yaml — type d'unité (type_unite des corpus de campagne)
# → spécialité (service d'hospitalisation), étage 1 de
# bench.scenarios.deriver_specialite.
#
# Producteur : Rémi (décisions, entrée par entrée).
# Campagne source : C1 (scenarios_C1.parquet) — valeurs relevées le 24/09/2026,
#   effectifs par branche en commentaire. Les valeurs nouvelles d'une campagne
#   entrent ici en `proposition`.
# Vocabulaire : les 55 libellés `lib_spe_uma` du dictionnaire
#   data/aphp/referentials/dictionnaire_spe_racine.parquet (vocabulaire
#   officiel des unités médicales AP-HP), ou la valeur DERIVER (« pas une
#   spécialité : l'étage 2 — dictionnaire par racine et groupe d'âge — décide »).
#   Une entrée `valide` hors vocabulaire est refusée au chargement, sauf si
#   elle l'assume avec `hors_vocabulaire: true` (le libellé est alors transmis
#   tel quel jusqu'au CR, et contrôlé tel quel par check_crh).
# RÈGLE D'APPLICATION : seules les entrées `statut: valide` sont appliquées par
#   la chaîne ; une entrée `proposition` est IGNORÉE (l'étage 2 prend le
#   relais). Corriger les statuts suffit à activer — aucun autre geste.
#
# Constat C1 : la branche courte (372 108 lignes) a type_unite nulle partout ;
#   aucune ligne UHCD (attendues en campagne 2, branche courte).

campagne: C1
producteur: Rémi
vocabulaire: data/aphp/referentials/dictionnaire_spe_racine.parquet (lib_spe_uma)
entrees:
  HC:            # 602 822 lignes (long) — hospitalisation complète : un mode, pas une spécialité
    specialite: DERIVER
    statut: valide
  GERIATRIE:     # 70 898 (long) — 69 844 en [80-[ ; libellé observé, hors des 55 du dictionnaire (décision Rémi)
    specialite: GERIATRIE
    statut: valide
    hors_vocabulaire: true   # libellé hors des 55 du dictionnaire, assumé
  NEONAT:        # 20 861 (long) — court-circuite le dictionnaire (qui donnerait OBSTETRIQUE, le service de la mère)
    specialite: NEONATOLOGIE
    statut: valide
  SC:            # 17 692 (long) — soins continus (périmètre USC+réa agrégé) ; en pratique les USC vivent
                 # dans les services de réanimation : « Réanimation » = nom de service plausible (décision Rémi)
    specialite: Réanimation
    statut: valide
    hors_vocabulaire: true   # libellé hors des 55 du dictionnaire, assumé
  SC-NEONAT:     # 2 470 (long) — même logique
    specialite: Réanimation néonatale
    statut: valide
    hors_vocabulaire: true   # libellé hors des 55 du dictionnaire, assumé
  HP:            # 674 (long) — toutes en « Séances simples » : la racine dira (dialyse, radiothérapie…)
    specialite: DERIVER
    statut: valide
  UHCD:          # 0 dans C1 — attendu campagne 2 ; lits porte des urgences (cohérent avec la conservation
                 # des DP imprécis en UHCD, chantier substitution)
    specialite: Urgences – UHCD
    statut: valide
    hors_vocabulaire: true   # libellé hors des 55 du dictionnaire, assumé
